<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tudis - PDF, Imagens, QR Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --secondary: #f97316;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-900: #111827;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: white;
      color: var(--gray-900);
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background: white;
      border-bottom: 1px solid var(--gray-100);
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }

    .logo-name {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    nav {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    nav a {
      color: var(--gray-600);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: var(--primary);
    }

    .btn-nav {
      background: var(--primary);
      color: white;
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-nav:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
    }

    /* Hero Section */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      padding: 4rem 3rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .hero-content h1 {
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }

    .hero-content p {
      font-size: 1.2rem;
      color: var(--gray-600);
      margin-bottom: 2rem;
      max-width: 500px;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 0.9rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
    }

    .btn-secondary {
      background: white;
      color: var(--primary);
      padding: 0.9rem 2rem;
      border: 2px solid var(--primary);
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .btn-secondary:hover {
      background: var(--gray-100);
    }

    .hero-image {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .hero-image img {
      width: 100%;
      max-width: 500px;
      height: auto;
      border-radius: 16px;
      object-fit: contain;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .decorative {
      position: absolute;
      font-size: 3rem;
      opacity: 0.3;
    }

    /* Ferramentas */
    .tools-section {
      background: var(--gray-100);
      padding: 4rem 3rem;
    }

    .tools-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .tools-section h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .category-tabs {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .tab {
      padding: 0.7rem 1.5rem;
      background: white;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      color: var(--gray-600);
    }

    .tab:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab.active {
      background: var(--primary);
      color: white;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .tool-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }

    .tool-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.15);
      border-color: var(--primary);
    }

    .tool-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .tool-name {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .tool-desc {
      font-size: 0.85rem;
      color: var(--gray-600);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 2rem;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      margin-bottom: 2rem;
    }

    .modal-header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.8rem;
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 2rem;
    }

    .dropzone {
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      background: rgba(37, 99, 235, 0.05);
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 1.5rem;
    }

    .dropzone:hover,
    .dropzone.drag-over {
      border-color: var(--primary);
      background: rgba(37, 99, 235, 0.1);
    }

    .dropzone-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .dropzone-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    input[type="file"] {
      display: none;
    }

    .file-preview {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      margin: 1rem 0;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-sm-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      flex: 1;
      min-height: 44px;
    }

    .btn-sm-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
    }

    .btn-sm-secondary {
      background: var(--gray-100);
      color: var(--gray-900);
      border: 1px solid var(--gray-200);
    }

    .btn-sm-secondary:hover {
      background: var(--gray-200);
    }

    .result-section {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(34, 197, 94, 0.1));
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 1.5rem;
      border-radius: 12px;
      margin-top: 1.5rem;
      display: none;
      text-align: center;
    }

    .result-section.show {
      display: block;
    }

    .result-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .result-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #10b981;
    }

    .download-btn {
      background: linear-gradient(135deg, #10b981, #34d399);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      gap: 0.5rem;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }

    .download-btn:hover {
      transform: scale(1.05);
    }

    .control-group {
      margin-bottom: 1rem;
    }

    .control-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .control-group input[type="range"],
    .control-group input[type="text"],
    .control-group input[type="number"],
    .control-group textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--gray-200);
      border-radius: 4px;
    }

    textarea {
      resize: vertical;
      min-height: 150px;
      font-family: monospace;
    }

    canvas {
      max-width: 100%;
      border-radius: 8px;
      margin: 1rem 0;
    }

    #qr-display {
      text-align: center;
      margin: 2rem 0;
      display: none;
    }

    #qr-display.show {
      display: block;
    }

    footer {
      background: var(--gray-900);
      color: white;
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }

      nav {
        flex-direction: column;
        text-align: center;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 2rem 1rem;
      }

      .hero-content h1 {
        font-size: 2.5rem;
      }

      .tools-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo-section">
      <img src="https://static.wixstatic.com/media/e97d0f_7b2e70b565f34b1aa03de70ad61d0b1f~mv2.png/v1/fill/w_474,h_598,al_c,lg_1,q_85,enc_avif,quality_auto/e97d0f_7b2e70b565f34b1aa03de70ad61d0b1f~mv2.png" alt="Tudis" class="logo-img">
      <div class="logo-name">Tudis</div>
    </div>
    <nav>
      <a href="#ferramentas">Ferramentas</a>
      <a href="#sobre">Sobre</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Fazemos documentos fáceis.</h1>
      <p>Todas as ferramentas que você precisa para ser mais produtivo e trabalhar de forma inteligente com documentos, imagens e QR codes.</p>
      <div class="hero-buttons">
        <button class="btn-primary" onclick="document.getElementById('ferramentas').scrollIntoView({behavior:'smooth'})">🚀 Explorar Ferramentas</button>
        <button class="btn-secondary" onclick="alert('Sobre Tudis em breve!')">📖 Saiba Mais</button>
      </div>
    </div>
    <div class="hero-image">
      <img src="https://static.wixstatic.com/media/e97d0f_7b2e70b565f34b1aa03de70ad61d0b1f~mv2.png/v1/fill/w_474,h_598,al_c,lg_1,q_85,enc_avif,quality_auto/e97d0f_7b2e70b565f34b1aa03de70ad61d0b1f~mv2.png" alt="Tudis">
      <span class="decorative" style="top: 20px; right: 40px;">📄</span>
      <span class="decorative" style="bottom: 30px; left: 20px;">🖼️</span>
      <span class="decorative" style="top: 40%; right: -30px;">🎯</span>
    </div>
  </section>

  <!-- Ferramentas -->
  <section class="tools-section" id="ferramentas">
    <div class="tools-container">
      <h2>Todas as Ferramentas</h2>
      <div class="category-tabs">
        <button class="tab active" data-cat="todas">Todas</button>
        <button class="tab" data-cat="pdf">PDF</button>
        <button class="tab" data-cat="imagem">Imagens</button>
        <button class="tab" data-cat="qrcode">QR Code</button>
      </div>
      <div class="tools-grid" id="tools-grid"></div>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal" id="tool-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p id="rodape-sistema"></p>
  </footer>

  <script>
    const CONFIG = {
      SISTEMA: 'Tudis',
      VERSAO: '6.19.0.0',
      DESENVOLVEDOR: 'Vettore Sistemas'
    };
    document.getElementById('rodape-sistema').textContent = `${CONFIG.SISTEMA} v${CONFIG.VERSAO}•Desenvolvido por ${CONFIG.DESENVOLVEDOR}`;

    const { PDFDocument } = PDFLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let rotationGir = 0;

    function rotatePreview(angle) {
      rotationGir += angle;
      const preview = document.getElementById('prev-gir');
      if(preview) preview.style.transform = `rotate(${rotationGir}deg)`;
    }

    const tools = [
      {id:'separar-pdf',icon:'✂️',name:'Separar PDF',desc:'Separa cada página em arquivo',cat:'pdf'},
      {id:'juntar-pdf',icon:'📎',name:'Juntar PDF',desc:'Combina múltiplos PDFs',cat:'pdf'},
      {id:'comprimir-pdf',icon:'🗜️',name:'Comprimir PDF',desc:'Reduz tamanho do PDF',cat:'pdf'},
      {id:'dividir-pdf',icon:'📊',name:'Dividir PDF',desc:'Divide PDF por intervalo',cat:'pdf'},
      {id:'rodar-pdf',icon:'🔄',name:'Rodar PDF',desc:'Rotaciona páginas',cat:'pdf'},
      {id:'numerar-pdf',icon:'#️⃣',name:'Numerar Páginas',desc:'Adiciona números',cat:'pdf'},
      {id:'marca-pdf',icon:'💧',name:'Marca d\'água',desc:'Adiciona marca ao PDF',cat:'pdf'},
      {id:'proteger-pdf',icon:'🔐',name:'Proteger PDF',desc:'Adiciona senha',cat:'pdf'},
      {id:'desbloquear-pdf',icon:'🔓',name:'Desbloquear PDF',desc:'Remove proteção',cat:'pdf'},
      {id:'comprimir-img',icon:'✅',name:'Comprimir Imagem',desc:'Reduz tamanho',cat:'imagem'},
      {id:'redimensionar-img',icon:'📐',name:'Redimensionar',desc:'Ajusta dimensões',cat:'imagem'},
      {id:'recortar-img',icon:'✂️',name:'Recortar Imagem',desc:'Recorta áreas',cat:'imagem'},
      {id:'girar-img',icon:'🔄',name:'Girar Imagem',desc:'Rotaciona imagem',cat:'imagem'},
      {id:'remover-bg',icon:'🎯',name:'Remover Fundo',desc:'Remove fundo branco',cat:'imagem'},
      {id:'melhorar-img',icon:'⬆️',name:'Melhorar Imagem',desc:'Aumenta resolução',cat:'imagem'},
      {id:'desfoque-img',icon:'👤',name:'Desfoque Facial',desc:'Desfoca rostos',cat:'imagem'},
      {id:'marca-img',icon:'🎨',name:'Marcar Imagem',desc:'Adiciona marca d\'água',cat:'imagem'},
      {id:'memes-img',icon:'😂',name:'Gerador de Memes',desc:'Cria memes',cat:'imagem'},
      {id:'qr-url',icon:'🌐',name:'QR Code URL',desc:'Gera QR de URL',cat:'qrcode'},
      {id:'qr-texto',icon:'📝',name:'QR Code Texto',desc:'Gera QR de texto',cat:'qrcode'},
      {id:'qr-wifi',icon:'📡',name:'QR Code WiFi',desc:'Gera QR de WiFi',cat:'qrcode'},
    ];

    function renderTools(cat) {
      const grid = document.getElementById('tools-grid');
      grid.innerHTML = '';
      const filtered = cat === 'todas' ? tools : tools.filter(t => t.cat === cat);
      filtered.forEach(t => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `<div class="tool-icon">${t.icon}</div><div class="tool-name">${t.name}</div><div class="tool-desc">${t.desc}</div>`;
        card.addEventListener('click', () => openTool(t));
        grid.appendChild(card);
      });
    }

    function openTool(t) {
      document.getElementById('modal-title').textContent = t.name;
      if(t.id === 'separar-pdf') renderSepararPDF();
      else if(t.id === 'juntar-pdf') renderJuntarPDF();
      else if(t.id === 'comprimir-pdf') renderComprimirPDF();
      else if(t.id === 'dividir-pdf') renderDividirPDF();
      else if(t.id === 'rodar-pdf') renderRodarPDF();
      else if(t.id === 'numerar-pdf') renderNumerarPDF();
      else if(t.id === 'marca-pdf') renderMarcaPDF();
      else if(t.id === 'proteger-pdf') renderProtegerPDF();
      else if(t.id === 'desbloquear-pdf') renderDesbloquearPDF();
      else if(t.id === 'comprimir-img') renderComprimirImg();
      else if(t.id === 'redimensionar-img') renderRedimensionarImg();
      else if(t.id === 'recortar-img') renderRecortarImg();
      else if(t.id === 'girar-img') renderGirarImg();
      else if(t.id === 'remover-bg') renderRemoverBG();
      else if(t.id === 'melhorar-img') renderMelhorarImg();
      else if(t.id === 'desfoque-img') renderDesfoque();
      else if(t.id === 'marca-img') renderMarcaImg();
      else if(t.id === 'memes-img') renderMemes();
      else if(t.id === 'qr-url') renderQRURL();
      else if(t.id === 'qr-texto') renderQRTexto();
      else if(t.id === 'qr-wifi') renderQRWiFi();
      else document.getElementById('modal-body').innerHTML = '<p style="text-align:center;padding:2rem;">✅ Ferramenta pronta para implementação.</p>';
      document.getElementById('tool-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('tool-modal').classList.remove('show');
    }

    // SEPARAR PDF
    function renderSepararPDF() {
      document.getElementById('modal-body').innerHTML = `
        <div class="dropzone" id="drop-sep"><div class="dropzone-icon">📤</div><div class="dropzone-text">Arraste seu PDF</div><input type="file" id="inp-sep" accept="application/pdf"></div>
        <div id="info-sep" style="display:none;"><p id="meta-sep"></p></div>
        <div class="button-group" id="btn-sep" style="display:none;"><button class="btn-sm-secondary" onclick="resetSeparar()">Limpar</button><button class="btn-sm-primary" id="proc-sep">✂️ Separar</button></div>
        <div class="result-section" id="res-sep"><a href="#" class="download-btn" id="down-sep" download="paginas.zip">⬇️ Baixar ZIP</a></div>
      `;
      const drop = document.getElementById('drop-sep');
      const inp = document.getElementById('inp-sep');
      const btn = document.getElementById('proc-sep');
      let file = null;

      drop.addEventListener('click', () => inp.click());
      drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('drag-over');});
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {e.preventDefault(); drop.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]);});
      inp.addEventListener('change', e => loadFile(e.target.files[0]));

      async function loadFile(f) {
        if(!f || f.type !== 'application/pdf') return alert('Selecione um PDF');
        file = f;
        drop.style.display = 'none';
        document.getElementById('info-sep').style.display = 'block';
        document.getElementById('btn-sep').style.display = 'flex';
        document.getElementById('meta-sep').textContent = `${f.name} • ${(f.size/1024/1024).toFixed(1)}MB`;
        const buf = await f.arrayBuffer();
        const pdf = await PDFDocument.load(buf, {ignoreEncryption: true});
        btn.disabled = false;
        btn.textContent = `✂️ Separar ${pdf.getPageCount()} página(s)`;
      }

      btn.addEventListener('click', async () => {
        if(!file) return;
        btn.disabled = true;
        const buf = await file.arrayBuffer();
        const pdf = await PDFDocument.load(buf, {ignoreEncryption: true});
        const zip = new JSZip();
        const count = pdf.getPageCount();
        for(let i = 0; i < count; i++) {
          const newPdf = await PDFDocument.create();
          const [page] = await newPdf.copyPages(pdf, [i]);
          newPdf.addPage(page);
          const bytes = await newPdf.save();
          zip.file(`pagina-${String(i+1).padStart(3,'0')}.pdf`, bytes);
        }
        const blob = await zip.generateAsync({type:'blob'});
        const url = URL.createObjectURL(blob);
        document.getElementById('down-sep').href = url;
        document.getElementById('res-sep').classList.add('show');
        btn.disabled = false;
      });
    }

    function resetSeparar() {
      document.getElementById('drop-sep').style.display = 'block';
      document.getElementById('info-sep').style.display = 'none';
      document.getElementById('btn-sep').style.display = 'none';
      document.getElementById('res-sep').classList.remove('show');
    }

    // JUNTAR PDF
    function renderJuntarPDF() {
      document.getElementById('modal-body').innerHTML = `
        <div class="dropzone" id="drop-jun"><div class="dropzone-icon">📎</div><div class="dropzone-text">Arraste PDFs</div><input type="file" id="inp-jun" accept="application/pdf" multiple></div>

      `;
      const drop = document.getElementById('drop-jun');
      const inp = document.getElementById('inp-jun');
      const btn = document.getElementById('proc-jun');
      let files = [];

      drop.addEventListener('click', () => inp.click());
      drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('drag-over');});
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {e.preventDefault(); drop.classList.remove('drag-over'); loadFiles(e.dataTransfer.files);});
      inp.addEventListener('change', e => loadFiles(e.target.files));

      function loadFiles(f) {
        files = Array.from(f).filter(x => x.type === 'application/pdf');
        if(!files.length) return alert('Selecione PDFs');
        drop.style.display = 'none';
        document.getElementById('info-jun').style.display = 'block';
        document.getElementById('btn-jun').style.display = 'flex';

        html += '</ul>';
        document.getElementById('list-jun').innerHTML = html;
        btn.disabled = false;
      }

      btn.addEventListener('click', async () => {
        if(!files.length) return;
        btn.disabled = true;
        const merged = await PDFDocument.create();
        for(let f of files) {
          const buf = await f.arrayBuffer();
          const pdf = await PDFDocument.load(buf, {ignoreEncryption: true});
          const pages = await merged.copyPages(pdf, pdf.getPageIndices());
          pages.forEach(p => merged.addPage(p));
        }
        const bytes = await merged.save();
        const blob = new Blob([bytes], {type: 'application/pdf'});
        const url = URL.createObjectURL(blob);
        document.getElementById('down-jun').href = url;
        document.getElementById('res-jun').classList.add('show');
        btn.disabled = false;
      });
    }

    // COMPRIMIR PDF — motor de recompressão de imagens (preserva texto, vetores, links, formulários e metadados)
    const NIVEIS_CPDF = {
      basico:   {nome: 'Básico',   dpi: 200, q: 0.80, a4: false},
      moderado: {nome: 'Moderado', dpi: 150, q: 0.65, a4: true},
      forte:    {nome: 'Forte',    dpi: 120, q: 0.55, a4: true}
    };

    function fmtTam(b) {
      const o = {minimumFractionDigits: 1, maximumFractionDigits: 1};
      return b < 1024*1024 ? (b/1024).toLocaleString('pt-BR', o) + ' kB' : (b/1024/1024).toLocaleString('pt-BR', o) + ' MB';
    }

    async function cpdfStreamPipe(bytes, stream) {
      return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
    }

    function cpdfUnpredict(data, colors, columns) {
      const rb = columns * colors, rows = Math.floor(data.length / (rb + 1));
      const out = new Uint8Array(rows * rb);
      let prev = new Uint8Array(rb);
      for(let r = 0; r < rows; r++) {
        const ft = data[r*(rb+1)], src = r*(rb+1) + 1, cur = out.subarray(r*rb, (r+1)*rb);
        for(let i = 0; i < rb; i++) {
          const x = data[src+i], a = i >= colors ? cur[i-colors] : 0, b = prev[i], c = i >= colors ? prev[i-colors] : 0;
          let v;
          if(ft === 0) v = x;
          else if(ft === 1) v = x + a;
          else if(ft === 2) v = x + b;
          else if(ft === 3) v = x + ((a + b) >> 1);
          else { const p = a + b - c, pa = Math.abs(p-a), pb = Math.abs(p-b), pc = Math.abs(p-c); v = x + (pa <= pb && pa <= pc ? a : pb <= pc ? b : c); }
          cur[i] = v & 255;
        }
        prev = cur;
      }
      return out;
    }

    function cpdfComponentes(ctx, cs) {
      const {PDFName, PDFArray} = PDFLib;
      cs = ctx.lookup(cs);
      if(cs instanceof PDFName) return ({'/DeviceRGB': 3, '/DeviceGray': 1})[cs.toString()] || 0;
      if(cs instanceof PDFArray && cs.size() > 0) {
        const tipo = ctx.lookup(cs.get(0)).toString();
        if(tipo === '/CalRGB') return 3;
        if(tipo === '/CalGray') return 1;
        if(tipo === '/ICCBased') {
          const icc = ctx.lookup(cs.get(1));
          const n = icc && icc.dict ? icc.dict.lookup(PDFName.of('N')) : null;
          return n && (n.asNumber() === 1 || n.asNumber() === 3) ? n.asNumber() : 0;
        }
      }
      return 0;
    }

    function cpdfFiltros(dict) {
      const {PDFName, PDFArray} = PDFLib;
      const f = dict.lookup(PDFName.of('Filter'));
      if(!f) return [];
      if(f instanceof PDFArray) return Array.from({length: f.size()}, (_, i) => dict.context.lookup(f.get(i)).toString());
      return [f.toString()];
    }

    // Decodifica a imagem para um bitmap; retorna null se o formato não for seguro de recomprimir
    async function cpdfDecodificar(ctx, stream) {
      const {PDFName, PDFArray, PDFBool} = PDFLib;
      const d = stream.dict;
      const num = k => { const v = d.lookup(PDFName.of(k)); return v && v.asNumber ? v.asNumber() : 0; };
      const w = num('Width'), h = num('Height'), bpc = num('BitsPerComponent');
      if(!w || !h || w*h < 40000 || bpc !== 8) return null;
      if(d.lookup(PDFName.of('ImageMask')) === PDFBool.True) return null;
      if(d.lookup(PDFName.of('Decode'))) return null;
      if(d.lookup(PDFName.of('Mask')) instanceof PDFArray) return null; // máscara por cor exige pixels exatos
      const n = cpdfComponentes(ctx, d.get(PDFName.of('ColorSpace')));
      if(!n) return null; // CMYK, Indexed, Separation, Lab etc. ficam intactos
      const filtros = cpdfFiltros(d);
      const bruto = stream.contents;

      if(filtros.includes('/DCTDecode')) {
        if(filtros.length !== 1) return null;
        const bmp = await createImageBitmap(new Blob([bruto], {type: 'image/jpeg'}));
        if(bmp.width !== w || bmp.height !== h) { bmp.close(); return null; }
        return {bmp, w, h, n, jpeg: true};
      }
      if(filtros.some(f => !['/FlateDecode', '/LZWDecode', '/ASCII85Decode', '/ASCIIHexDecode', '/RunLengthDecode'].includes(f))) return null;

      let parms = d.lookup(PDFName.of('DecodeParms'));
      if(parms instanceof PDFArray) parms = ctx.lookup(parms.get(parms.size()-1));
      const pred = parms && parms.lookup && parms.lookup(PDFName.of('Predictor')) ? parms.lookup(PDFName.of('Predictor')).asNumber() : 1;
      if(pred !== 1 && pred < 10) return null;

      let px;
      if(filtros.length === 1 && filtros[0] === '/FlateDecode') {
        try { px = await cpdfStreamPipe(bruto, new DecompressionStream('deflate')); } catch(e) { px = null; }
      }
      if(!px && PDFLib.decodePDFRawStream) {
        try { px = PDFLib.decodePDFRawStream(stream).decode(); } catch(e) { return null; }
      }
      if(!px) return null;
      if(pred >= 10) px = cpdfUnpredict(px, n, w);
      if(px.length < w*h*n) return null;

      const rgba = new Uint8ClampedArray(w*h*4);
      for(let i = 0, j = 0; i < w*h; i++, j += 4) {
        if(n === 1) { rgba[j] = rgba[j+1] = rgba[j+2] = px[i]; }
        else { rgba[j] = px[i*3]; rgba[j+1] = px[i*3+1]; rgba[j+2] = px[i*3+2]; }
        rgba[j+3] = 255;
      }
      const bmp = await createImageBitmap(new ImageData(rgba, w, h));
      return {bmp, w, h, n, jpeg: false};
    }

    async function cpdfJpeg(bmp, w, h, q) {
      let src = bmp, sw = bmp.width, sh = bmp.height;
      const novo = (a, b) => { if(typeof OffscreenCanvas !== 'undefined') return new OffscreenCanvas(a, b); const c = document.createElement('canvas'); c.width = a; c.height = b; return c; };
      // redução em etapas (metade por vez) para evitar serrilhado e preservar legibilidade
      while(sw / 2 >= w && sh / 2 >= h) {
        const c = novo(Math.round(sw/2), Math.round(sh/2)), x = c.getContext('2d');
        x.imageSmoothingQuality = 'high';
        x.drawImage(src, 0, 0, c.width, c.height);
        src = c; sw = c.width; sh = c.height;
      }
      const c = novo(w, h), x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.imageSmoothingQuality = 'high';
      x.drawImage(src, 0, 0, w, h);
      const blob = c.convertToBlob ? await c.convertToBlob({type: 'image/jpeg', quality: q}) : await new Promise(r => c.toBlob(r, 'image/jpeg', q));
      return new Uint8Array(await blob.arrayBuffer());
    }

    function cpdfColetarLixo(ctx) {
      const {PDFRef, PDFDict, PDFArray, PDFStream} = PDFLib;
      const vistos = new Set(), pilha = [ctx.trailerInfo.Root, ctx.trailerInfo.Info];
      while(pilha.length) {
        const o = pilha.pop();
        if(!o) continue;
        if(o instanceof PDFRef) {
          const k = o.objectNumber + ' ' + o.generationNumber;
          if(vistos.has(k)) continue;
          vistos.add(k); pilha.push(ctx.lookup(o));
        } else if(o instanceof PDFDict) { for(const [, v] of o.entries()) pilha.push(v); }
        else if(o instanceof PDFArray) { for(let i = 0; i < o.size(); i++) pilha.push(o.get(i)); }
        else if(o instanceof PDFStream) pilha.push(o.dict);
      }
      let removidos = 0;
      for(const [ref] of ctx.enumerateIndirectObjects()) {
        if(!vistos.has(ref.objectNumber + ' ' + ref.generationNumber)) { ctx.delete(ref); removidos++; }
      }
      return removidos;
    }

    async function comprimirPDFBytes(buf, nivel, progresso, cancelado) {
      const {PDFDocument, PDFName, PDFNumber, PDFRawStream} = PDFLib;
      const cfg = NIVEIS_CPDF[nivel];
      const pdf = await PDFDocument.load(buf, {updateMetadata: false, ignoreEncryption: true});
      if(pdf.isEncrypted) throw new Error('PDF protegido por senha/criptografia — não é possível comprimir sem remover a proteção.');
      const ctx = pdf.context;

      // limite de resolução: maior lado/menor lado de página × DPI alvo (conservador: nunca reduz abaixo do necessário para página inteira)
      let pgL = 0, pgC = 0;
      pdf.getPages().forEach(p => {
        const {width, height} = p.getSize();
        pgL = Math.max(pgL, width, height); pgC = Math.max(pgC, Math.min(width, height));
        p.node.delete(PDFName.of('Thumb')); // miniaturas são regeneradas pelos leitores
      });
      // Moderado/Forte: páginas gigantes (ex.: scanner que grava 2480×3507 pt) são tratadas como A4 para cálculo do DPI
      if(cfg.a4) { pgL = Math.min(pgL, 842); pgC = Math.min(pgC, 595); }
      const maxL = pgL / 72 * cfg.dpi, maxC = pgC / 72 * cfg.dpi;

      const imagens = [];
      for(const [ref, obj] of ctx.enumerateIndirectObjects()) {
        if(obj instanceof PDFRawStream && obj.dict.lookup(PDFName.of('Subtype')) === PDFName.of('Image')) imagens.push([ref, obj]);
      }
      let trocadas = 0;
      for(let i = 0; i < imagens.length; i++) {
        if(cancelado()) throw new Error('cancelado');
        progresso(i + 1, imagens.length);
        const [ref, st] = imagens[i];
        let dec;
        try { dec = await cpdfDecodificar(ctx, st); } catch(e) { dec = null; }
        if(!dec) continue;
        const escala = Math.min(1, maxL / Math.max(dec.w, dec.h), maxC / Math.min(dec.w, dec.h));
        const reduz = escala < 0.9;
        const nw = reduz ? Math.max(1, Math.round(dec.w * escala)) : dec.w;
        const nh = reduz ? Math.max(1, Math.round(dec.h * escala)) : dec.h;
        let jpg;
        try { jpg = await cpdfJpeg(dec.bmp, nw, nh, cfg.q); } catch(e) { jpg = null; }
        dec.bmp.close && dec.bmp.close();
        // só substitui se houver ganho real (JPEG sem redução precisa render ≥15%, evitando perda à toa)
        if(!jpg || jpg.length >= st.contents.length * (dec.jpeg && !reduz ? 0.85 : 0.95)) continue;
        const nd = st.dict.clone(ctx);
        ['Filter', 'DecodeParms', 'Length', 'DL'].forEach(k => nd.delete(PDFName.of(k)));
        nd.set(PDFName.of('Width'), PDFNumber.of(nw));
        nd.set(PDFName.of('Height'), PDFNumber.of(nh));
        nd.set(PDFName.of('BitsPerComponent'), PDFNumber.of(8));
        nd.set(PDFName.of('Filter'), PDFName.of('DCTDecode'));
        if(dec.n === 1) nd.set(PDFName.of('ColorSpace'), PDFName.of('DeviceRGB'));
        ctx.assign(ref, PDFRawStream.of(nd, jpg));
        trocadas++;
      }

      // compressão sem perdas de fluxos que estão sem filtro (conteúdo de páginas, fontes etc.); XMP fica legível
      for(const [ref, obj] of ctx.enumerateIndirectObjects()) {
        if(!(obj instanceof PDFRawStream) || obj.dict.lookup(PDFName.of('Filter'))) continue;
        if(obj.dict.lookup(PDFName.of('Type')) === PDFName.of('Metadata') || obj.contents.length < 512) continue;
        try {
          const z = await cpdfStreamPipe(obj.contents, new CompressionStream('deflate'));
          if(z.length < obj.contents.length) {
            const nd = obj.dict.clone(ctx);
            nd.delete(PDFName.of('Length'));
            nd.set(PDFName.of('Filter'), PDFName.of('FlateDecode'));
            ctx.assign(ref, PDFRawStream.of(nd, z));
          }
        } catch(e) {}
      }

      const lixo = cpdfColetarLixo(ctx);
      const bytes = await pdf.save({useObjectStreams: true});
      return {bytes, trocadas, total: imagens.length, lixo};
    }

      inp.addEventListener('change', e => loadFile(e.target.files[0]));
      document.querySelectorAll('.cpdf-niveis button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('.cpdf-niveis button').forEach(x => x.classList.remove('ativo'));
        b.classList.add('ativo'); nivel = b.dataset.n; mostrar();
      }));
      window._cpdfCancelar = () => { sessao++; buf = null; cache = {}; };

      function mostrar() {
        const r = cache[nivel];
        if(!r || r.calculando) {
          est.innerHTML = `<span class="novo">calculando…</span><s>${fmtTam(original)}</s>`;
          det.textContent = r && r.prog ? `Analisando imagem ${r.prog}` : '';
          btn.disabled = true; return;
        }
        if(r.erro) { est.innerHTML = `<span style="color:#dc2626;">${r.erro}</span>`; det.textContent = ''; btn.disabled = true; return; }
        const pct = Math.round((1 - r.bytes.length / original) * 100);
        est.innerHTML = `<span class="novo">~${fmtTam(r.bytes.length)}</span><s>${fmtTam(original)}</s><span class="pct">(${pct > 0 ? '-' + pct : 0}%)</span>`;
        det.textContent = r.semGanho ? 'Arquivo já otimizado — será mantido o original, sem alterações.' : `${r.trocadas} de ${r.total} imagem(ns) otimizada(s) • texto, links, formulários e metadados preservados`;
        btn.disabled = false;
      }

      async function calcular(n, s) {
        cache[n] = {calculando: true};
        try {
          const r = await comprimirPDFBytes(buf.slice(0), n, (a, t) => { if(s === sessao) { cache[n].prog = `${a}/${t}`; if(n === nivel) mostrar(); } }, () => s !== sessao);
          if(s !== sessao) return;
          const semGanho = r.bytes.length >= original;
          cache[n] = {...r, bytes: semGanho ? new Uint8Array(buf) : r.bytes, semGanho};
        } catch(e) {
          if(s !== sessao) return;
          cache[n] = {erro: 'Erro: ' + e.message};
        }
        if(n === nivel) mostrar();
      }

      async function loadFile(f) {
        if(!f || f.type !== 'application/pdf') return alert('Selecione um PDF');
        const s = ++sessao;
        buf = await f.arrayBuffer(); nome = f.name.replace(/\.pdf$/i, ''); original = f.size; cache = {};
        drop.style.display = 'none';
        document.getElementById('info-cpdf').style.display = 'block';
        document.getElementById('btn-cpdf').style.display = 'flex';
        document.getElementById('meta-cpdf').textContent = f.name;
        const txt = new TextDecoder('latin1').decode(new Uint8Array(buf));
        document.getElementById('aviso-cpdf').innerHTML = /\/ByteRange\s*\[/.test(txt)
          ? '<div class="cpdf-aviso">⚠️ Este PDF tem <strong>assinatura digital</strong>. Qualquer compressão invalida a assinatura. Guarde o original para fins legais.</div>' : '';
        mostrar();
        for(const n of ['moderado', 'basico', 'forte']) { if(s !== sessao) return; await calcular(n, s); }
      }

      btn.addEventListener('click', () => {
        const r = cache[nivel];
        if(!r || !r.bytes) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([r.bytes], {type: 'application/pdf'}));
        a.download = `${nome}-comprimido.pdf`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      });
    }

    // DIVIDIR PDF
    function renderDividirPDF() {
      document.getElementById('modal-body').innerHTML = `
        <div class="dropzone" id="drop-div"><div class="dropzone-icon">📊</div><div class="dropzone-text">Arraste seu PDF</div><input type="file" id="inp-div" accept="application/pdf"></div>
        <div id="info-div" style="display:none;"><p id="meta-div"></p></div>
        <div class="control-group" id="ctrl-div" style="display:none;"><label>Páginas por arquivo</label><input type="number" id="int-div" min="1" value="1"></div>
        <div class="button-group" id="btn-div" style="display:none;"><button class="btn-sm-secondary" onclick="resetDividir()">Limpar</button><button class="btn-sm-primary" id="proc-div">📊 Dividir</button></div>
        <div class="result-section" id="res-div"><div id="txt-div" style="margin-bottom:0.5rem;"></div><a href="#" class="download-btn" id="down-div" download="dividido.zip">⬇️ Baixar ZIP</a></div>
      `;
      const drop = document.getElementById('drop-div');
      const inp = document.getElementById('inp-div');
      const btn = document.getElementById('proc-div');
      let pdfSrc = null, baseName = 'documento', total = 0;

      drop.addEventListener('click', () => inp.click());
      drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('drag-over');});
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', e => {e.preventDefault(); drop.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]);});
      inp.addEventListener('change', e => loadFile(e.target.files[0]));

      async function loadFile(f) {
        if(!f || f.type !== 'application/pdf') return alert('Selecione um PDF');
        try {
          pdfSrc = await PDFDocument.load(await f.arrayBuffer(), {ignoreEncryption: true});
        } catch(e) { return alert('Erro ao ler PDF: ' + e.message); }
        total = pdfSrc.getPageCount();
        baseName = f.name.replace(/\.pdf$/i, '');
        drop.style.display = 'none';
        document.getElementById('info-div').style.display = 'block';
        document.getElementById('ctrl-div').style.display = 'block';
        document.getElementById('btn-div').style.display = 'flex';
        document.getElementById('meta-div').textContent = `${f.name} • ${total} página(s) • ${(f.size/1024/1024).toFixed(2).replace('.', ',')}MB`;
        document.getElementById('int-div').max = total;
      }

      btn.addEventListener('click', async () => {
        if(!pdfSrc) return;
        const step = Math.max(1, parseInt(document.getElementById('int-div').value) || 1);
        btn.disabled = true;
        btn.textContent = '⏳ Dividindo...';
        try {
          const zip = new JSZip();
          let n = 0;
          for(let ini = 0; ini < total; ini += step) {
            const fim = Math.min(ini + step, total);
            const out = await PDFDocument.create();
            const idx = Array.from({length: fim - ini}, (_, k) => ini + k);
            (await out.copyPages(pdfSrc, idx)).forEach(p => out.addPage(p));
            const nome = step === 1
              ? `${baseName}-pag-${String(ini+1).padStart(3,'0')}.pdf`
              : `${baseName}-pags-${String(ini+1).padStart(3,'0')}-a-${String(fim).padStart(3,'0')}.pdf`;
            zip.file(nome, await out.save());
            n++;
          }
          const blob = await zip.generateAsync({type:'blob'});
          const url = URL.createObjectURL(blob);
          const a = document.getElementById('down-div');
          a.href = url;
          a.download = `${baseName}-dividido.zip`;
          document.getElementById('txt-div').innerHTML = `<strong>✅ ${n} arquivo(s) gerado(s)</strong>`;
          document.getElementById('res-div').classList.add('show');
          a.click();
        } catch(e) {
          alert('Erro ao dividir: ' + e.message);
        }
        btn.disabled = false;
        btn.textContent = '📊 Dividir';
      });
    }
